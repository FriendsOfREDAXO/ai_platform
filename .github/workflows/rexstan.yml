name: rexstan

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

permissions:
    contents: read

jobs:
    rexstan:
        env:
            ADDON_KEY: ai_platform

        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v4

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.3'
                    extensions: gd, intl, pdo_mysql
                    coverage: none

            -   name: Download latest REDAXO release
                run: |
                    LATEST_RELEASE=$(curl -L -s -H 'Accept: application/json' https://github.com/redaxo/redaxo/releases/latest)
                    REDAXO_VERSION=$(echo $LATEST_RELEASE | sed -e 's/.*"tag_name":"\([^"]*\)".*/\1/')
                    echo "Downloaded REDAXO $REDAXO_VERSION"
                    curl -Ls -o redaxo.zip https://github.com/redaxo/redaxo/releases/download/$REDAXO_VERSION/redaxo_$REDAXO_VERSION.zip
                    unzip -oq redaxo.zip -d redaxo_cms
                    rm redaxo.zip

            -   name: Init database
                run: |
                    sudo /etc/init.d/mysql start
                    mysql -uroot -h127.0.0.1 -proot -e 'create database redaxo5;'

            -   name: Setup REDAXO
                run: |
                    php redaxo_cms/redaxo/bin/console setup:run -n --lang=de_de --agree-license --db-host=127.0.0.1 --db-name=redaxo5 --db-password=root --db-createdb=no --db-setup=normal --admin-username=admin --admin-password=adminpassword --error-email=test@redaxo.invalid --ansi
                    php redaxo_cms/redaxo/bin/console config:set --type boolean debug.enabled true
                    php redaxo_cms/redaxo/bin/console config:set --type boolean debug.throw_always_exception true

            # Caret constraints on purpose: '2.*' lets the next major's pre-releases
            # through ('3.0-beta2' sorts below '3.0'), and rexstan 3 renamed the class
            # .tools/rexstan.php calls. That is how the first run of this job failed.
            # rexstan 1.x as in ycom and yform: 2.0.36 crashed its parallel workers on
            # psr/log (its own 1.1.4 against REDAXO core's 3.x).
            #
            # The optional integrations (YCom for OAuth sign-in, the api addon for the
            # REST routes, cronjob for the cleanup job) are installed so their classes
            # resolve. vendor/ is copied because it is committed (see phpunit.yml).
            -   name: Copy and install addons
                run: |
                    rsync -a --exclude='.tools/vendor' --exclude='.github' --exclude='.git' --exclude='redaxo_cms' './' 'redaxo_cms/redaxo/src/addons/ai_platform'
                    redaxo_cms/redaxo/bin/console install:download 'rexstan' '^1.0'
                    redaxo_cms/redaxo/bin/console package:install 'rexstan'
                    redaxo_cms/redaxo/bin/console package:install 'cronjob'
                    redaxo_cms/redaxo/bin/console package:install 'phpmailer'
                    redaxo_cms/redaxo/bin/console install:download 'yform' '^5.0'
                    redaxo_cms/redaxo/bin/console package:install 'yform'
                    redaxo_cms/redaxo/bin/console install:download 'yrewrite' '^2.0'
                    redaxo_cms/redaxo/bin/console package:install 'yrewrite'
                    redaxo_cms/redaxo/bin/console install:download 'ycom' '^4.0'
                    redaxo_cms/redaxo/bin/console package:install 'ycom'
                    redaxo_cms/redaxo/bin/console install:download 'api' '^1.0'
                    redaxo_cms/redaxo/bin/console package:install 'api'
                    redaxo_cms/redaxo/bin/console package:install 'ai_platform'

            -   name: Write rexstan config
                working-directory: redaxo_cms
                run: php -f redaxo/src/addons/ai_platform/.tools/rexstan.php

            -   name: Run rexstan
                run: redaxo_cms/redaxo/bin/console rexstan:analyze
