name: PHP-CS-Fixer

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

permissions:
    contents: read

jobs:
    code-style:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v4

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.2'
                    extensions: gd, intl, pdo_mysql
                    coverage: none

            # dev tools live in .tools/: vendor/ in the addon root is committed and shipped
            -   name: Install tools
                working-directory: .tools
                run: composer install --prefer-dist --no-progress

            -   name: Run PHP CS Fixer
                working-directory: .tools
                run: composer cs-dry
